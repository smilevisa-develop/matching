name: 死活監視 (毎時 30 分)

# 本番が応答しないときに担当者へメールする。アプリが止まっていても届くように Apps Script へ直接送る。
# 毎正時はスプシ同期 (sync-sheet.yml) が動くので、30 分ごとにどちらかが本番を呼ぶ。
on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 本番の応答を確認する
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://matching.smilereach.jp' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 20 -o /dev/null "${APP_URL%/}/api/health"; then echo "OK"; exit 0; fi
            sleep 60
          done
          echo "::error::本番が応答しません (${APP_URL})"
          exit 1
      - name: 応答がないときはメールする
        if: failure()
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://matching.smilereach.jp' }}
          SCRIPT_URL: ${{ secrets.APPS_SCRIPT_EMAIL_URL }}
          SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_EMAIL_SECRET }}
        run: |
          jq -n --arg secret "$SCRIPT_SECRET" --arg url "$APP_URL" '{
            secret: $secret,
            to: "kodai.tsuchida@smilevisa.jp",
            subject: "【SMILE MATCHING】本番が応答していません",
            text: ($url + " が 3 回続けて応答しませんでした。サーバーの状態を確認してください。")
          }' | curl -fsSL -m 60 -X POST -H 'Content-Type: application/json' -d @- "$SCRIPT_URL" -o /dev/null
